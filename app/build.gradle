plugins { id 'com.android.application' }
android {
 namespace 'es.farcompeticiones'
 compileSdk 35
 defaultConfig { applicationId 'es.farcompeticiones'; minSdk 26; targetSdk 35; versionCode 45; versionName '0.45' }
 signingConfigs {
   release {
     storeFile file(System.getenv('FAR_KEYSTORE_PATH') ?: 'far-release-placeholder.jks')
     storePassword System.getenv('FAR_KEYSTORE_PASSWORD') ?: ''
     keyAlias System.getenv('FAR_KEY_ALIAS') ?: 'farcompeticiones'
     keyPassword System.getenv('FAR_KEYSTORE_PASSWORD') ?: ''
   }
 }
 buildTypes {
   release {
     minifyEnabled false
     signingConfig signingConfigs.release
   }
 }
}

dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
