name: Analizar clubes y escudos M14
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install beautifulsoup4
      - run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          from bs4 import BeautifulSoup
          for cid in ('11','12','15'):
              url=f'https://farugby.matchready.es/es/public/calendar/35/{cid}/combined/'
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=40) as r: soup=BeautifulSoup(r.read(),'html.parser')
              print('COMPETICION',cid)
              seen=set()
              for table in soup.find_all('table'):
                  rows=table.find_all('tr')
                  header=next((r for r in rows if r.find('th')),None)
                  if not header: continue
                  labels=[c.get_text(' ',strip=True).upper() for c in header.find_all(['td','th'],recursive=False)]
                  if not all(x in labels for x in ('EQUIPO','J','PUNTOS')): continue
                  for row in rows[rows.index(header)+1:]:
                      cells=row.find_all(['td','th'],recursive=False)
                      if len(cells)!=len(labels): continue
                      name=cells[labels.index('EQUIPO')].get_text(' ',strip=True)
                      if not name or name in seen: continue
                      seen.add(name)
                      print('EQUIPO',name)
                      for img in row.select('img'):
                          print('ESCUDO',urllib.parse.urljoin(url,img.get('src','')), 'ALT',img.get('alt',''))
                      for a in cells[labels.index('EQUIPO')].select('a[href]'):
                          print('ENLACE',urllib.parse.urljoin(url,a['href']))
              print('TOTAL',len(seen))
          PY
