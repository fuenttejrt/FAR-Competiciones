name: Descubrir actas MatchReady M14
on:
  workflow_dispatch:
    inputs:
      actualizar_calendario:
        description: 'Guardar los cambios de calendario validados'
        type: boolean
        default: false
  schedule:
    - cron: '47 7,19 * * *'
  push:
    paths:
      - '.github/workflows/descubrir-actas-m14.yml'
concurrency:
  group: calendario-m14
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  descubrir:
    runs-on: ubuntu-latest
    steps:
      - run: pip install beautifulsoup4
      - name: Comparar calendarios y actualizar en ejecución autorizada
        env:
          ACTUALIZAR: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.actualizar_calendario) }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os,json,re,urllib.request,urllib.parse,unicodedata
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from bs4 import BeautifulSoup
          from collections import Counter
          base=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SECRET_KEY']
          host='https://farugby.matchready.es'
          def get(table,params):
              rows=[]
              while True:
                  q=dict(params,limit=200,offset=len(rows),order='id.asc')
                  req=urllib.request.Request(base+'/rest/v1/'+table+'?'+urllib.parse.urlencode(q),headers={'apikey':key})
                  with urllib.request.urlopen(req,timeout=30) as r: page=json.load(r)
                  rows.extend(page)
                  if len(page)<200:return rows
          def actid(url):
              u=urllib.parse.urlparse(urllib.parse.urljoin(host,url or ''))
              m=re.fullmatch(r'/es/public/competition/match_pdf/(\d+)/act/?',u.path)
              return m.group(1) if u.scheme=='https' and u.netloc=='farugby.matchready.es' and m else None
          def norm(v):
              return ''.join(c for c in unicodedata.normalize('NFKD',str(v).casefold()) if c.isalnum())
          def dbdate(v):
              if not v:return None
              d=datetime.fromisoformat(v.replace('Z','+00:00'))
              return (d.astimezone(ZoneInfo('Europe/Madrid')) if d.tzinfo else d).date().isoformat()
          teams=get('equipos',{'select':'*'})
          print('EQUIPOS 69 esquema',sorted(teams[0]) if teams else [])
          namefield=next((f for f in ('nombre','nombre_completo','nombre_oficial') if teams and f in teams[0]),None)
          if not namefield:raise SystemExit('Campo nombre de equipo no reconocido')
          names={t['id']:t[namefield] for t in teams}
          totals=Counter()
          reconciliation=Counter()
          proposed=[]
          verified_links=0
          verified_times=0
          proposed_rounds=[]
          round_dates={}
          round_meta={}
          round_sizes=Counter()
          for cid in ('11','12','15'):
              comps=get('competiciones',{'id_oficial':'eq.35/'+cid,'select':'id'})
              if len(comps)!=1:raise SystemExit('Competición ambigua')
              db=[]
              jornadas=get('jornadas',{'competicion_id':'eq.'+str(comps[0]['id']),'select':'*'})
              print('JORNADAS 70 esquema',sorted(jornadas[0]) if jornadas else [])
              jmap={j['id']:j for j in jornadas}
              for j in jornadas:
                  db.extend(get('partidos',{'jornada_id':'eq.'+str(j['id']),'select':'id,jornada_id,url_acta,id_oficial,equipo_local_id,equipo_visitante_id,fecha_hora,puntos_local,puntos_visitante'}))
              sample=get('partidos',{'jornada_id':'eq.'+str(j['id']),'select':'*'})
              print('ESQUEMA 68',sorted(sample[0]) if sample else [])
              known={actid(m['url_acta']) for m in db if m['url_acta']}
              if None in known:raise SystemExit('Enlace almacenado no reconocido')
              url=host+'/es/public/calendar/35/'+cid+'/combined/'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  if urllib.parse.urlparse(r.geturl()).netloc!='farugby.matchready.es':raise SystemExit('Redirección inesperada')
                  soup=BeautifulSoup(r.read(),'html.parser')
              found=set()
              fixtures=[]
              round_keys=[]
              contexts=[]
              rows=0
              skipped=0
              score_counts=Counter()
              link_patterns=Counter()
              ambiguous=0
              for table in soup.select('table'):
                  trs=table.find_all('tr')
                  header=next((i for i,tr in enumerate(trs) if tr.find('th')),None)
                  if header is None:continue
                  h=' '.join(trs[header].stripped_strings).lower()
                  if not all(x in h for x in ('equipo local','equipo visitante','resultado','fecha/hora')):continue
                  headers=[' '.join(c.stripped_strings).lower() for c in trs[header].find_all(['td','th'],recursive=False)]
                  idx=[next(i for i,h in enumerate(headers) if label in h) for label in ('equipo local','equipo visitante','resultado','fecha/hora')]
                  heading=table.find_previous(lambda tag: tag.name in ('h1','h2','h3','h4','h5','h6') and re.search(r'Jornada\s+\d+\.\d+',tag.get_text(' ',strip=True),re.I))
                  context=heading.get_text(' ',strip=True) if heading else ''
                  if not context:
                      prev=table.find_previous(string=re.compile(r'Jornada\s+\d+\.\d+',re.I))
                      context=str(prev).strip() if prev else ''
                  rm=re.search(r'Jornada\s+(\d+\.\d+)',context,re.I)
                  round_key=rm.group(1) if rm else None
                  print('TABLA 71',cid,round_key,context[:180])
                  for tr in trs[header+1:]:
                      cells=tr.find_all(['td','th'],recursive=False)
                      if len(cells)<4:continue
                      if len(cells)<=max(idx):
                          skipped+=1
                          continue
                      home,away,score,date=[' '.join(cells[i].stripped_strings).strip() for i in idx]
                      if not home or not away or home.lower()=='equipo local' or away.lower()=='equipo visitante' or tr.find('th'):
                          skipped+=1
                          print('FILA 67 descartada',cid,'celdas',len(cells),'cabecera',bool(tr.find('th')),'equipos_presentes',bool(home and away))
                          continue
                      rows+=1
                      home=re.split(r'Árbitro:',home,flags=re.I)[0].strip()
                      away=re.split(r'Campo:',away,flags=re.I)[0].strip()
                      live=[urllib.parse.urlparse(urllib.parse.urljoin(host,a['href'])).path for a in tr.select('a[href]') if '/live_act/' in a['href']]
                      if norm(home)==norm(away)=='descanso':
                          rows-=1
                          reconciliation['descansos']+=1
                          continue
                      fixtures.append((home,away,date,score))
                      round_keys.append(round_key)
                      contexts.append(context)
                      if live:print('DIRECTO 68',cid,home,away,date,score,live)
                      if not re.fullmatch(r'\s*\d+\s*[-:]\s*\d+\s*',score):print('PENDIENTE 68',cid,home,away,date,score,'atributos',sorted(tr.attrs.keys()))
                      score_counts['con_marcador' if re.fullmatch(r'\s*\d+\s*[-:]\s*\d+\s*',score) else 'sin_marcador']+=1
                      for a in tr.select('a[href]'):
                          u=urllib.parse.urlparse(urllib.parse.urljoin(host,a['href']))
                          if u.netloc=='farugby.matchready.es':link_patterns[re.sub(r'\d+','{id}',u.path)]+=1
                      ids={actid(a.get('href')) for a in tr.select('a[href]')}-{None}
                      if len(ids)>1:ambiguous+=1
                      elif ids:found.update(ids)
              matched=set()
              counts=Counter()
              for (home,away,date,score),round_key,context in zip(fixtures,round_keys,contexts):
                  try: day=datetime.strptime(date.split()[0],'%d/%m/%Y').date().isoformat()
                  except (ValueError,IndexError):
                      counts['fecha_web_invalida']+=1
                      continue
                  candidates=[m for m in db if norm(names.get(m['equipo_local_id'],''))==norm(home) and norm(names.get(m['equipo_visitante_id'],''))==norm(away) and dbdate(m['fecha_hora'])==day]
                  if round_key:
                      by_round=[m for m in db if norm(names.get(m['equipo_local_id'],''))==norm(home) and norm(names.get(m['equipo_visitante_id'],''))==norm(away) and re.search(r'Jornada\s+'+re.escape(round_key)+r'(?!\d)',jmap[m['jornada_id']]['nombre'],re.I)]
                      if len(by_round)==1 and (not candidates or candidates[0]['id']==by_round[0]['id']):
                          candidates=by_round
                          counts['por_jornada']+=1
                      else:
                          counts['jornada_discrepante']+=1
                          candidates=[]
                  else:counts['jornada_web_no_detectada']+=1
                  if len(candidates)!=1:
                      counts['sin_asociar' if not candidates else 'ambiguos']+=1
                      print('DIFERENCIA 69',cid,home,away,day,'candidatos',len(candidates))
                      pairs=[m for m in db if norm(names.get(m['equipo_local_id'],''))==norm(home) and norm(names.get(m['equipo_visitante_id'],''))==norm(away)]
                      print('FECHAS 70',cid,home,away,day,json.dumps([dict(id=m['id'],fecha=m['fecha_hora'],jornada=m['jornada_id'],oficial=m['id_oficial'],marcador=[m['puntos_local'],m['puntos_visitante']]) for m in pairs],ensure_ascii=False))
                      counts['pareja_unica' if len(pairs)==1 else 'pareja_multiple' if pairs else 'pareja_ausente']+=1
                      continue
                  m=candidates[0]
                  if m['id'] in matched:
                      counts['duplicados']+=1
                      continue
                  matched.add(m['id'])
                  if m['url_acta']:verified_links+=1
                  j=jmap[m['jornada_id']]
                  if norm(context)!=norm(j['nombre']):
                      counts['contexto_distinto']+=1
                      print('CONTEXTO 72',cid,j['id'],context,j['nombre'])
                  jid=j['id']
                  round_dates.setdefault(jid,set()).add(day)
                  round_meta[jid]=j
                  round_sizes[jid]+=1
                  hm=re.fullmatch(r'\d{2}/\d{2}/\d{4}\s+(\d{2}:\d{2})',date.strip())
                  if hm and hm.group(1)!='00:00':
                      dt=datetime.strptime(date.strip(),'%d/%m/%Y %H:%M').replace(tzinfo=ZoneInfo('Europe/Madrid'))
                      old=datetime.fromisoformat(m['fecha_hora'].replace('Z','+00:00')) if m['fecha_hora'] else None
                      if old==dt:verified_times+=1
                      if old!=dt:
                          proposed.append(dict(id=m['id'],jornada=jid,anterior=m['fecha_hora'],nueva=dt.isoformat(),tipo='hora_nueva' if old is None else 'hora_modificada'))
                  elif not m['fecha_hora']:counts['sin_hora_publicada']+=1
                  else:counts['hora_web_no_confirmada']+=1
                  if jmap[m['jornada_id']]['fecha_inicio']!=day:
                      counts['fecha_jornada_distinta']+=1
                      print('CAMBIO 71',cid,m['id'],jmap[m['jornada_id']]['nombre'],jmap[m['jornada_id']]['fecha_inicio'],day)
                  if not m['fecha_hora'] and len(date.split())>1 and date.split()[1]!='00:00':counts['hora_nueva']+=1
                  counts['asociados']+=1
                  sc=re.fullmatch(r'\s*(\d+)\s*[-:]\s*(\d+)\s*',score)
                  if sc and (m['puntos_local'],m['puntos_visitante'])!=tuple(map(int,sc.groups())):counts['marcador_distinto']+=1
                  if not sc and (m['puntos_local'] is not None or m['puntos_visitante'] is not None):counts['marcador_pendiente_db']+=1
              counts['db_sin_asociar']=len(db)-len(matched)
              for m in db:
                  if m['id'] not in matched:
                      j=jmap[m['jornada_id']]
                      print('PENDIENTE DB 70',cid,m['id'],names.get(m['equipo_local_id']),names.get(m['equipo_visitante_id']),m['fecha_hora'],json.dumps({k:v for k,v in j.items() if k in ('id','nombre','numero','fecha','fecha_inicio','id_oficial','titulo')},ensure_ascii=False))
              reconciliation.update(counts)
              print('ASOCIACION 69',cid,json.dumps(dict(counts),sort_keys=True))
              print('REPETIDOS 68',cid,[(list(k),v) for k,v in Counter(fixtures).items() if v>1])
              print('DIAGNOSTICO 67',cid,'descartadas',skipped,'marcadores',dict(score_counts),'rutas',dict(link_patterns))
              c=dict(partidos_db=len(db),filas_web=rows,actas_db=len(known),actas_web=len(found),coincidentes=len(known&found),nuevas_candidatas=len(found-known),no_localizadas=len(known-found),ambiguas=ambiguous)
              print('DESCUBRIMIENTO 66',cid,json.dumps(c,sort_keys=True))
              totals.update(c)
          for jid,days in sorted(round_dates.items()):
              j=round_meta[jid]
              if round_sizes[jid]!=3:
                  print('JORNADA 72 incompleta',jid,round_sizes[jid])
                  continue
              if len(days)>1:
                  print('JORNADA 72 parcial',jid,j['nombre'],sorted(days),'conservar fecha base')
              elif next(iter(days))!=j['fecha_inicio']:
                  print('JORNADA 72 cambio completo',jid,j['nombre'],j['fecha_inicio'],next(iter(days)))
                  proposed_rounds.append(dict(id=jid,anterior=j['fecha_inicio'],nueva=next(iter(days))))
          for p in proposed:print('PROPUESTA 72',json.dumps(p,sort_keys=True))
          print('TOTAL 72',json.dumps(dict(Counter(p['tipo'] for p in proposed)),sort_keys=True))
          if reconciliation['asociados']!=totals['partidos_db'] or reconciliation['asociados']!=totals['filas_web'] or reconciliation['contexto_distinto'] or reconciliation['jornada_web_no_detectada']:raise SystemExit('Simulación no autorizable: asociación o contexto incompleto')
          print('TOTAL 69',json.dumps(dict(reconciliation),sort_keys=True))
          print('TOTAL 66',json.dumps(dict(totals),sort_keys=True))
          if totals['no_localizadas'] or totals['ambiguas'] or not totals['filas_web']:raise SystemExit('Calendario no reconciliado')
          history=get('historial_calendario_m14',{'select':'id,entidad,entidad_id,anterior,nuevo'})
          expected_ids={19,20,21,22,23,24,49,50,51,52,53,54,79,80,81,82,83,84}
          initial=[h for h in history if h['entidad']=='partido' and h['entidad_id'] in expected_ids and h['anterior'].get('fecha_hora') is None]
          moved=[h for h in history if h['entidad']=='jornada' and h['entidad_id']==18 and h['anterior'].get('fecha_inicio')=='2026-11-28' and h['nuevo'].get('fecha_inicio')=='2026-11-29']
          if len(initial)!=18 or {h['entidad_id'] for h in initial}!=expected_ids or len(moved)!=1:raise SystemExit('Historial inicial no reconciliado')
          for h in initial:
              rows=get('partidos',{'id':'eq.'+str(h['entidad_id']),'select':'id,fecha_hora'})
              if len(rows)!=1 or not rows[0]['fecha_hora']:raise SystemExit('Horario inicial ausente')
          print('AUDITORIA 75',json.dumps(dict(historial=len(history),horarios_iniciales=len(initial),jornada_inicial=len(moved),actas_asociadas=verified_links,horarios_coincidentes=verified_times,propuestas=len(proposed),jornadas_propuestas=len(proposed_rounds)),sort_keys=True))
          payload=dict(p_partidos=proposed,p_jornadas=proposed_rounds,p_simular=True)
          req=urllib.request.Request(base+'/rest/v1/rpc/actualizar_calendario_m14',data=json.dumps(payload).encode(),headers={'apikey':key,'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=60) as resp: result=json.load(resp)
          print('SIMULACION 73',json.dumps(result,sort_keys=True))
          if result!={'partidos':len(proposed),'jornadas':len(proposed_rounds),'simulacion':True}:raise SystemExit('Resultado RPC discrepante')
          print('MODO 76', 'actualizacion autorizada' if os.environ.get('ACTUALIZAR')=='true' else 'solo simulacion')
          if os.environ.get('ACTUALIZAR')=='true' and (proposed or proposed_rounds):
              if reconciliation['marcador_distinto'] or reconciliation['marcador_pendiente_db']:raise SystemExit('Marcadores discrepantes')
              before=get('historial_calendario_m14',{'select':'id'})
              def rpc():
                  payload['p_simular']=False
                  req=urllib.request.Request(base+'/rest/v1/rpc/actualizar_calendario_m14',data=json.dumps(payload).encode(),headers={'apikey':key,'Content-Type':'application/json'},method='POST')
                  with urllib.request.urlopen(req,timeout=60) as resp:return json.load(resp)
              first=rpc()
              print('ESCRITURA 74',json.dumps(first,sort_keys=True))
              if first!={'partidos':len(proposed),'jornadas':len(proposed_rounds),'simulacion':False}:raise SystemExit('Escritura discrepante')
              second=rpc()
              print('REPETICION 74',json.dumps(second,sort_keys=True))
              if second!={'partidos':0,'jornadas':0,'simulacion':False}:raise SystemExit('Repetición discrepante')
              for p in proposed:
                  rows=get('partidos',{'id':'eq.'+str(p['id']),'select':'id,fecha_hora'})
                  if len(rows)!=1 or datetime.fromisoformat(rows[0]['fecha_hora'].replace('Z','+00:00'))!=datetime.fromisoformat(p['nueva']):raise SystemExit('Persistencia partido discrepante')
              for j in proposed_rounds:
                  rows=get('jornadas',{'id':'eq.'+str(j['id']),'select':'id,fecha_inicio'})
                  if len(rows)!=1 or rows[0]['fecha_inicio']!=j['nueva']:raise SystemExit('Persistencia jornada discrepante')
              after=get('historial_calendario_m14',{'select':'id'})
              if len(after)-len(before)!=len(proposed)+len(proposed_rounds):raise SystemExit('Historial discrepante')
              print('PERSISTENCIA 74',len(proposed),len(proposed_rounds),'historial nuevo',len(after)-len(before))
          PY
