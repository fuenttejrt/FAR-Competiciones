name: Sincronizar documentos oficiales
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sincronizar_documentos.py'
      - 'scripts/test_sincronizar_documentos.py'
      - '.github/workflows/sincronizar-documentos.yml'
  schedule:
    - cron: '29 5,17 * * *'
permissions:
  contents: read
concurrency:
  group: catalogo-documentos-oficiales
  cancel-in-progress: false
jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install beautifulsoup4 pypdf
      - name: Comprobar temporadas y deduplicacion
        run: python -m unittest discover -s scripts -p test_sincronizar_documentos.py -v
      - name: Archivar documentos sin activar reglas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u -m scripts.sincronizar_documentos
