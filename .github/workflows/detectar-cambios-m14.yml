name: Detectar cambios de actas M14
on:
  workflow_dispatch:
    inputs:
      aplicar_correcciones:
        description: Aplicar correcciones validadas con historial y estadisticas
        type: boolean
        default: false
  push:
    paths:
      - scripts/corregir_actas_m14.py
      - .github/workflows/detectar-cambios-m14.yml
  schedule:
    - cron: '17 7,19 * * *'
permissions:
  contents: read
concurrency:
  group: calendario-m14
  cancel-in-progress: false
jobs:
  detectar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pypdf pdfplumber
      - name: Validar y corregir actas modificadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APLICAR_CORRECCIONES: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.aplicar_correcciones) }}
        run: python -m scripts.corregir_actas_m14
