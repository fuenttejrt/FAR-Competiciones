name: Compilar APK Android firmada
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FAR_KEYSTORE_BASE64: ${{ secrets.FAR_KEYSTORE_BASE64 }}
      FAR_KEYSTORE_PASSWORD: ${{ secrets.FAR_KEYSTORE_PASSWORD }}
      FAR_KEY_ALIAS: ${{ secrets.FAR_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Comprobar secretos de firma
        run: |
          test -n "$FAR_KEYSTORE_BASE64" || { echo "Falta secreto FAR_KEYSTORE_BASE64"; exit 1; }
          test -n "$FAR_KEYSTORE_PASSWORD" || { echo "Falta secreto FAR_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$FAR_KEY_ALIAS" || { echo "Falta secreto FAR_KEY_ALIAS"; exit 1; }
      - name: Preparar clave de firma privada
        run: |
          echo "$FAR_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/far-release.jks"
          echo "FAR_KEYSTORE_PATH=$RUNNER_TEMP/far-release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK release firmada
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FAR-Competiciones-v0.3-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publicar APK directa en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FAR-Competiciones-v0.3.apk
          gh release delete v0.3 --yes 2>/dev/null || true
          git tag -f v0.3
          git push origin refs/tags/v0.3 --force
          gh release create v0.3 FAR-Competiciones-v0.3.apk --title "FAR Competiciones v0.3" --notes "Primera versión con firma permanente. Requiere una reinstalación inicial desde APK debug." --prerelease
