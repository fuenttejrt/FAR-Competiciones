name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar APK de prueba
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FAR-Competiciones-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publicar APK directa en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FAR-Competiciones-v0.2.apk
          gh release delete v0.2 --yes 2>/dev/null || true
          git tag -f v0.2
          git push origin refs/tags/v0.2 --force
          gh release create v0.2 FAR-Competiciones-v0.2.apk --title "FAR Competiciones v0.2" --notes "v0.2: consulta pública FAR y MatchReady en la aplicación; importación automática aún pendiente." --prerelease
