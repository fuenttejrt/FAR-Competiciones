name: Compilar APK Android firmada
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FAR_SIGNING_PASSWORD: ${{ secrets.FAR_SIGNING_PASSWORD }}
      FAR_KEY_ALIAS: farcompeticiones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Preparar firma permanente
        shell: bash
        run: |
          if [ -z "$FAR_SIGNING_PASSWORD" ]; then
            echo "Falta configurar el secreto FAR_SIGNING_PASSWORD"
            exit 1
          fi
          base64 --decode app/signing/release.jks.enc.b64 > "$RUNNER_TEMP/release.jks.enc"
          printf '%s' "$FAR_SIGNING_PASSWORD" | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$RUNNER_TEMP/release.jks.enc" -out "$RUNNER_TEMP/far-release.jks" -pass stdin
          echo "FAR_KEYSTORE_PATH=$RUNNER_TEMP/far-release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK firmada
        run: gradle --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: FAR-Competiciones-v0.3-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publicar APK directa en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FAR-Competiciones-v0.3.apk
          gh release delete v0.3 --yes 2>/dev/null || true
          git tag -f v0.3
          git push origin refs/tags/v0.3 --force
          gh release create v0.3 FAR-Competiciones-v0.3.apk --title "FAR Competiciones v0.3" --notes "APK con firma permanente." --prerelease
